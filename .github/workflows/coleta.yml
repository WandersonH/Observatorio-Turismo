name: Coleta

on:
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte a coletar
        required: true
        type: choice
        options: [cadastur, siconfi, ibge, caged, anac, antt, cetesb, alesp, planos_diretores, producoes, google_places]
      anos:
        description: "Exercícios, separados por espaço (só Siconfi; vazio = três últimos)"
        required: false
        default: ""
      todos:
        description: Todos os 645 municípios de SP, não só a base AMITESP
        type: boolean
        default: false
  schedule:
    - cron: "17 9 5 1,4,7,10 *"   # Cadastur: trimestral
    - cron: "23 9 10 5 *"         # Siconfi: depois do prazo da DCA (30/04)
    - cron: "41 9 5 9 *"          # IBGE: depois das estimativas de população

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OBS_BQ_PROJECT: ${{ vars.OBS_BQ_PROJECT }}
      TEM_GCP: ${{ secrets.GCP_SA_KEY != '' }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[bigquery,pdf]"

      - name: Autenticar no Google Cloud (só se o segredo existir)
        if: env.TEM_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Escolher a fonte
        id: alvo
        env:
          AGENDA: ${{ github.event.schedule }}
          ESCOLHIDA: ${{ inputs.fonte }}
        run: |
          case "$AGENDA" in
            "17 9 5 1,4,7,10 *") fonte=cadastur ;;
            "23 9 10 5 *")       fonte=siconfi ;;
            "41 9 5 9 *")        fonte=ibge ;;
            *)                   fonte="$ESCOLHIDA" ;;
          esac
          echo "fonte=$fonte" >> "$GITHUB_OUTPUT"

      - name: Cadastro mestre (IBGE)
        run: |
          set -o pipefail
          observatorio coletar ibge | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coletar ${{ steps.alvo.outputs.fonte }}
        if: steps.alvo.outputs.fonte != 'ibge'
        env:
          FONTE: ${{ steps.alvo.outputs.fonte }}
          ANOS: ${{ inputs.anos }}
          TODOS: ${{ inputs.todos }}
        run: |
          set -o pipefail
          args=()
          [ -n "$ANOS" ] && args+=(--anos $ANOS)
          [ "$TODOS" = "true" ] && args+=(--todos)
          observatorio coletar "$FONTE" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Conferir Siconfi contra a base 2023-2025
        if: steps.alvo.outputs.fonte == 'siconfi'
        run: |
          set -o pipefail
          python scripts/validar_siconfi.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar a carga como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-${{ steps.alvo.outputs.fonte }}-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: ignore
