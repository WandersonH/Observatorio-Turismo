name: Sondagem
on:
  push:
    branches: [sondagem]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests py7zr pdfplumber
      - run: python scripts/sondar.py
